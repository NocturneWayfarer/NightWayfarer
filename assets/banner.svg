<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" role="img" aria-label="Night Wayfarer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0F0E"/>
      <stop offset="55%" stop-color="#121614"/>
      <stop offset="100%" stop-color="#1B1F1C"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#50C878">
        <animate attributeName="stop-color" values="#50C878;#009999;#6A5ACD;#50C878" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#009999">
        <animate attributeName="stop-color" values="#009999;#6A5ACD;#50C878;#009999" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#6A5ACD">
        <animate attributeName="stop-color" values="#6A5ACD;#50C878;#009999;#6A5ACD" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#50C878" stop-opacity="0"/>
      <stop offset="50%" stop-color="#009999" stop-opacity="1"/>
      <stop offset="100%" stop-color="#6A5ACD" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#50C878" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#50C878" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- фон -->
  <rect width="900" height="220" fill="url(#bg)" rx="14"/>

  <!-- мягкое свечение за текстом -->
  <ellipse cx="450" cy="120" rx="360" ry="90" fill="url(#glow)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="6s" repeatCount="indefinite"/>
  </ellipse>

  <!-- звёзды -->
  <g fill="#E0E0E0">
    <circle cx="90" cy="40" r="1.4">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="70" r="1">
      <animate attributeName="opacity" values="1;0.2;1" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="35" r="1.2">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="620" cy="45" r="1.3">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="740" cy="80" r="1">
      <animate attributeName="opacity" values="1;0.3;1" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="50" r="1.4">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="5.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="30" r="1">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="390" cy="60" r="0.9">
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="4.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- имя -->
  <text x="450" y="115" text-anchor="middle"
        font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
        font-size="62" font-weight="700" letter-spacing="3"
        fill="url(#textGrad)">
    NIGHT WAYFARER
  </text>

  <!-- подзаголовок -->
  <text x="450" y="150" text-anchor="middle"
        font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
        font-size="16" font-weight="400" letter-spacing="2"
        fill="#B0B0B0" opacity="0.9">
    Backend &amp; Frontend developer
    <animate attributeName="opacity" values="0.55;1;0.55" dur="6s" repeatCount="indefinite"/>
  </text>

  <!-- линия с бегущим свечением -->
  <rect x="120" y="176" width="660" height="2" rx="1" fill="url(#lineGrad)">
    <animate attributeName="x" values="80;160;80" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- пунктирный «путь» странника -->
  <g stroke="#009999" stroke-width="1.2" stroke-linecap="round" opacity="0.5">
    <line x1="180" y1="196" x2="720" y2="196" stroke-dasharray="2 10">
      <animate attributeName="stroke-dashoffset" from="0" to="-120" dur="6s" repeatCount="indefinite"/>
    </line>
  </g>
</svg>
